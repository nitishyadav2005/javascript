<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const cal = (x,y) => {
            function add(x,y){
                document.write(x+y + "<br>");
            }
            function multiply(x,y){
                document.write(x*y + "<br>");
            }
            function sub(x,y){
                document.write(x-y + "<br>");
            }
            function divide(x,y){
                document.write(x/y + "<br>");
            }
            add(x,y);
            multiply(x,y);
            sub(x,y);
            divide(x,y);
        }
        cal(20,10);
    </script>
</body>
</html>
